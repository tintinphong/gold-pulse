name: Tests

# Deliberately not part of collect.yml: a failing suite or a dependency drift
# must never take live collection offline, since missed polls are data we'd
# have to go back and recover.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python -m unittest discover tests
